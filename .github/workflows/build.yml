name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            asset: EVE-Accel-windows-x64.exe
            extra: --uac-admin
          - os: macos-latest
            label: macos-arm64
            asset: EVE-Accel-macos-arm64
            extra: ""
          - os: macos-13
            label: macos-x64
            asset: EVE-Accel-macos-x64
            extra: ""
          - os: ubuntu-latest
            label: linux-x64
            asset: EVE-Accel-linux-x64
            extra: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Sanity check (import + CLI)
        run: |
          python -c "import ast,io;ast.parse(io.open('eve_accel.py',encoding='utf-8').read());print('syntax ok')"
          python eve_accel.py --status --no-pause

      - name: Build
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --console --clean \
            ${{ matrix.extra }} \
            --name "EVE-Accel" \
            --distpath dist eve_accel.py

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ -f "EVE-Accel.exe" ]; then mv "EVE-Accel.exe" "${{ matrix.asset }}"
          else mv "EVE-Accel" "${{ matrix.asset }}"; fi
          ls -la

      - name: Smoke test the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.asset }}"
          "./dist/${{ matrix.asset }}" --status --no-pause

      # Windows 版带 requireAdministrator 清单，CI 里不一定能直接起，失败不算数
      - name: Smoke test the binary (Windows, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}" --status --no-pause

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -laR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 |
            |------|------|
            | Windows 64 位 | `EVE-Accel-windows-x64.exe` |
            | macOS Apple 芯片 | `EVE-Accel-macos-arm64` |
            | macOS Intel | `EVE-Accel-macos-x64` |
            | Linux 64 位 | `EVE-Accel-linux-x64` |

            Windows 双击运行即可（会弹 UAC，改 hosts 需要管理员权限）。

            macOS / Linux 需要 root 权限改 `/etc/hosts`：

            ```bash
            chmod +x EVE-Accel-macos-arm64
            xattr -d com.apple.quarantine EVE-Accel-macos-arm64   # macOS 首次运行需要
            sudo ./EVE-Accel-macos-arm64
            ```

            杀毒软件/Gatekeeper 对未签名的打包程序普遍会拦，介意的话直接跑源码：
            `python eve_accel.py`（Python 3.8+，零第三方依赖）。
