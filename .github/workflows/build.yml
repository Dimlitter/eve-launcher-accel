name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 拿不到机器时别干等：默认超时是 6 小时。
    # 可选目标给的时间更短，免得打 tag 发版时为了它多等一刻钟。
    timeout-minutes: ${{ matrix.optional && 12 || 25 }}
    # 可选目标构建不出来也不挡发布（Intel Mac 和 ARM 机器池经常排不上）
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 主力目标，必须成功 ----
          - os: windows-latest
            label: windows-x64
            asset: EVE-Accel-windows-x64.exe
            extra: --uac-admin
          - os: macos-latest
            label: macos-arm64
            asset: EVE-Accel-macos-arm64
            extra: ""
          # Linux 用 22.04 构建，glibc 下限低一些，旧发行版也能跑
          - os: ubuntu-22.04
            label: linux-x64
            asset: EVE-Accel-linux-x64
            extra: ""

          # ---- 补充架构，尽力而为 ----
          - os: macos-13
            label: macos-x64
            asset: EVE-Accel-macos-x64
            extra: ""
            optional: true
          - os: windows-11-arm
            label: windows-arm64
            asset: EVE-Accel-windows-arm64.exe
            extra: --uac-admin
            optional: true
          - os: ubuntu-22.04-arm
            label: linux-arm64
            asset: EVE-Accel-linux-arm64
            extra: ""
            optional: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Sanity check (import + CLI)
        run: |
          python -c "import ast,io;ast.parse(io.open('eve_accel.py',encoding='utf-8').read());print('syntax ok')"
          python eve_accel.py --status --no-pause

      - name: Build
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --console --clean \
            ${{ matrix.extra }} \
            --name "EVE-Accel" \
            --distpath dist eve_accel.py

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ -f "EVE-Accel.exe" ]; then mv "EVE-Accel.exe" "${{ matrix.asset }}"
          else mv "EVE-Accel" "${{ matrix.asset }}"; fi
          ls -la

      - name: Smoke test the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.asset }}"
          "./dist/${{ matrix.asset }}" --status --no-pause

      # Windows 版带 requireAdministrator 清单，CI 里不一定能直接起，失败不算数
      - name: Smoke test the binary (Windows, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}" --status --no-pause

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    # 用 always()：可选目标排不到机器会被超时取消，而被取消的 job 会让整个 run 变成
    # cancelled，进而连累 release。所以这里不看 build 的整体结论，
    # 改成下面那步直接检查三个主力产物在不在。
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出这次实际构建出来的文件
        run: ls -la artifacts

      - name: 三个主力平台缺一个就不发版
        run: |
          missing=0
          for f in EVE-Accel-windows-x64.exe EVE-Accel-macos-arm64 EVE-Accel-linux-x64; do
            if [ -f "artifacts/$f" ]; then
              echo "有 $f"
            else
              echo "缺少 $f"; missing=1
            fi
          done
          exit $missing

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 |
            |------|------|
            | Windows 64 位 | `EVE-Accel-windows-x64.exe` |
            | Windows ARM | `EVE-Accel-windows-arm64.exe` |
            | macOS Apple 芯片 | `EVE-Accel-macos-arm64` |
            | macOS Intel | `EVE-Accel-macos-x64` |
            | Linux 64 位 | `EVE-Accel-linux-x64` |
            | Linux ARM | `EVE-Accel-linux-arm64` |

            ARM 版和 Intel Mac 版受构建机器供给影响，偶尔会缺；
            列表里没有的平台可以直接跑源码，零第三方依赖。

            Windows 双击运行即可（会弹 UAC，改 hosts 需要管理员权限）。

            macOS / Linux 需要 root 权限改 `/etc/hosts`：

            ```bash
            chmod +x EVE-Accel-macos-arm64
            xattr -d com.apple.quarantine EVE-Accel-macos-arm64   # macOS 首次运行需要
            sudo ./EVE-Accel-macos-arm64
            ```

            杀毒软件和 Gatekeeper 对未签名的打包程序普遍会拦，介意的话直接跑源码：
            `python eve_accel.py`（Python 3.8+，零第三方依赖）。
